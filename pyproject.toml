[project]
name = "libertadores-dashboard"
version = "1.0.0"
description = "Dashboard interactivo sobre la Libertadores API — cuarto capítulo de la serie de datos de Copa Libertadores."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
